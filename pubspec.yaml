name: flutter_corelib
description: "A comprehensive library for Flutter applications, providing utilities for management, local database, network operations, audio, localization, UI, and more."
version: 0.3.0
homepage: https://github.com/Glitch9Inc/flutter_corelib
repository: https://github.com/Glitch9Inc/flutter_corelib
issue_tracker: https://github.com/Glitch9Inc/flutter_corelib/issues
documentation: https://github.com/Glitch9Inc/flutter_corelib#readme
publish_to: "none" # Remove this line to publish to pub.dev

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # core packages
  dart_corelib:
    path: ../g9_dart_corelib
  logging: ^1.3.0
  uuid: ^4.6.0
  path: ^1.9.0 # Pinned by Flutter 3.27 flutter_test
  path_provider: ^2.1.5 # File management
  # url_launcher: ^6.2.6
  dio: ^5.10.0

  # local database
  shared_preferences: ^2.5.3

  # localization
  intl: ^0.19.0

  # Api Services
  # Google Services
  #googleapis: ^11.0.0
  #google_sign_in: ^6.2.1
  
  # Audio
  # just_audio: ^0.9.42 

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
